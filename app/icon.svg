<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The tab icon is the brand mark: the same rounded square, the same gradient,
    the same plane. The glyph is lucide's Plane, copied from what the app
    actually renders rather than redrawn, so the two cannot drift apart.

    Fixed colours on purpose. A favicon cannot follow the reader's theme, and
    these are saturated enough to hold their own against a light or a dark tab
    strip — a theme-aware mark would simply vanish into one of them.
  -->
  <defs>
    <linearGradient id="w" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2a78d6" />
      <stop offset="0.55" stop-color="#1baf7a" />
      <stop offset="1" stop-color="#e87ba4" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="9" fill="url(#w)" />

  <!-- Scaled from the 24-unit grid the glyph is drawn on: 20/24 leaves a
       margin that keeps the plane clear of the rounded corners. -->
  <g transform="translate(6 6) scale(0.8333)"
     fill="none" stroke="#ffffff" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z" />
  </g>
</svg>
